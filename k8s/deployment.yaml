apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo-dashboard
  namespace: gitops-demo
  labels:
    app.kubernetes.io/name: gitops-demo-dashboard
    app.kubernetes.io/part-of: gitops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-demo-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-demo-dashboard
        app.kubernetes.io/part-of: gitops-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: gitops-demo-dashboard:v1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
